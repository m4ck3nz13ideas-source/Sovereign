name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # No environment variables here on purpose. Configuration is read through
      # getters, so a missing key must produce a readable message at request
      # time rather than a failed build — this step is what proves that.
      - run: npm run build

  rules:
    name: Database rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4

      # Every migration, in order, then every suite — both by glob rather than
      # by a list.
      #
      # This job used to name the files it applied, and the list stopped at
      # 0003 while the schema went to 0026. It passed for months because the
      # three files it did apply were self-consistent, and it was checking
      # almost nothing: 01_rules.sql had grown a reference to law_acceptances
      # (0018) and seed.sql to proposal_readiness (0007), so the day either one
      # was touched the job failed for a reason that had nothing to do with the
      # change. A list is the bug. Do not reintroduce one.
      - name: Apply every migration and run every suite
        run: |
          psql -c "create database sovereign_test"
          ARGS=(-f supabase/tests/00_supabase_shim.sql)
          for m in supabase/migrations/*.sql; do ARGS+=(-f "$m"); done
          ARGS+=(-f supabase/tests/00b_support.sql)
          for t in supabase/tests/[0-9][0-9]_*.sql; do
            case "$t" in *00_supabase_shim*|*00b_support*) continue;; esac
            ARGS+=(-f "$t")
          done
          # Each suite raises if any of its checks failed, so a non-zero exit
          # is the whole assertion — no output parsing.
          psql -d sovereign_test -v ON_ERROR_STOP=1 "${ARGS[@]}"

      - name: The worked example must apply to a fresh database
        run: |
          psql -c "create database sovereign_seed"
          ARGS=(-f supabase/tests/00_supabase_shim.sql)
          for m in supabase/migrations/*.sql; do ARGS+=(-f "$m"); done
          psql -d sovereign_seed -v ON_ERROR_STOP=1 "${ARGS[@]}"
          psql -d sovereign_seed -v ON_ERROR_STOP=1 \
            -c "insert into auth.users (id, email) values (gen_random_uuid(), 'ci@example.com')" \
            -f supabase/seed.sql

      # The rules that only break when two people act at the same moment.
      # Everything above runs in one psql session, which cannot overlap
      # anything with anything — see supabase/tests/concurrency/run.py for what
      # "genuinely overlapping" means here and why serialising the operations
      # and asserting the answer would prove nothing.
      - name: Concurrency
        run: |
          python3 -m pip install --quiet "psycopg[binary]"
          psql -c "create database sovereign_race"
          ARGS=(-f supabase/tests/00_supabase_shim.sql)
          for m in supabase/migrations/*.sql; do ARGS+=(-f "$m"); done
          ARGS+=(-f supabase/tests/00b_support.sql)
          ARGS+=(-f supabase/tests/concurrency/fixture.sql)
          psql -d sovereign_race -v ON_ERROR_STOP=1 "${ARGS[@]}"
          PGDATABASE=sovereign_race python3 supabase/tests/concurrency/run.py
